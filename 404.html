    <script>
      ;(() => {
        const root = document.documentElement
        // appearance is injected into this template at build time, so the very
        // first paint can follow the site config instead of only the browser
        // preferences and the storage
        const appearance = root.dataset.appearance || 'auto'
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
        let isDark = false

        if (appearance === 'force-dark') {
          isDark = true
        } else if (appearance === 'force-auto') {
          isDark = prefersDark
        } else if (appearance === 'light') {
          isDark = false
        } else {
          const fallback = appearance === 'dark' ? 'dark' : 'auto'
          const preference =
            localStorage.getItem('vuepress-color-scheme') || fallback

          isDark = preference === 'auto' ? prefersDark : preference === 'dark'
        }

        root.dataset.theme = isDark ? 'dark' : 'light'
      })()
    </script>
